name: Offline regressions

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      SERVER_INTERACTIVE_LOGIN: "0"
      SESSION_REFRESH_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Load the real PoW WASM module
        run: python -c "from deepseek.pow import DeepSeekPow; DeepSeekPow()"
      - run: python -m unittest discover -s tests -t . -v
      - run: bash -n ds bin/ds-chat
      - run: node --check .opencode/plugin/deepseek-tool-discipline.js
